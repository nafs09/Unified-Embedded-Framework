[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uef-gen"
version = "0.1.0"
description = "Standalone embedded project builder for UETD"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "jsonschema>=4"]

[project.optional-dependencies]
templates = ["Jinja2>=3"]
hardware-discovery = ["pyusb>=1.2", "pyserial>=3.5"]
pyocd = ["pyocd>=0.36"]
language-server = ["pygls>=2.1.1,<3"]
dev = ["ruff>=0.16", "yapf>=0.43"]

[project.scripts]
uef-gen = "uef_gen.cli:main"
uef-gen-language-server = "uef_gen.language.server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 154
target-version = "py311"
exclude = ["third_party", "vendor", "vendors", "build", "out", "dist"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 1
lines-between-types = 0
no-sections = true
split-on-trailing-comma = false

[tool.setuptools.package-data]
"uef_gen.language.registry" = ["*.json"]
"uef_gen.schemas" = ["*.json"]
"uef_gen.language.frontends.system" = ["*.json"]
