name: Bug report
description: Report a reproducible problem in UETD, uef-gen, or their integration.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first. Do not include secrets, private logs, or
        publicly disclose security vulnerabilities; follow SECURITY.md for
        security reports.
  - type: checkboxes
    id: prior-search
    attributes:
      label: Existing issue search
      options:
        - label: I searched existing issues for this problem.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - UETD
        - uef-gen
        - UETD and uef-gen integration
        - Documentation or examples
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Include the package version or Git commit for each affected component.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and target
      description: Include OS, compiler/toolchain, exact chip, board and revision, and relevant configuration.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that reproduces the problem.
      placeholder: "1. Configure ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety or equipment impact
      description: Could this behavior create unsafe operation, damage equipment, or risk injury?
      options:
        - No known safety or equipment impact
        - Possibly or unknown
        - Yes
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and additional evidence
      description: Redact credentials, personal data, and unrelated device output.
      render: text
    validations:
      required: false
